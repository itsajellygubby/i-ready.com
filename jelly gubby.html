*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding-bottom:84px;position:relative}
.grid-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,var(--primary-light),transparent 65%)}
.grid-bg::before{content:"";position:absolute;inset:-75px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:75px 75px;animation:drift 40s linear infinite}
.grid-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,var(--bg))}
@keyframes drift{to{transform:translate3d(-75px,75px,0)}}
header{height:84px;display:flex;align-items:center;gap:.6rem;padding:0 clamp(16px,4vw,48px)}
.logo{display:flex;align-items:center;gap:.7rem;font-size:1.5rem;font-weight:800;letter-spacing:-.04em;color:var(--primary)}
.logo img{height:44px;width:84px;object-fit:fill}
.header-actions{margin-left:auto;display:flex;gap:.5rem}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:border-color .2s}
.icon-btn:hover{border-color:var(--primary)}
.icon-btn img{width:18px;height:18px;filter:var(--icon-filter)}
.hero{width:min(720px,92vw);margin:clamp(24px,7vh,80px) auto 2.5rem}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.05;letter-spacing:-.05em;font-weight:800;margin-bottom:.6rem}
.hero>p{color:var(--text-muted);font-size:15px;margin-bottom:1.6rem}
.search{display:flex;align-items:center;gap:.9rem;padding:9px 10px 9px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg)}
.search:focus-within{border-color:var(--primary)}
.search svg{width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:1.8;flex:none}
#searchBar{flex:1;min-width:0;height:42px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px}
#searchBar::placeholder{color:var(--text-light)}
.chips{display:flex;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.chips select{background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:10px;padding:.6rem .9rem;font:inherit;font-size:13px;cursor:pointer;outline:0}
.chips select:hover,.chips select:focus{border-color:var(--primary);background:var(--surface);color:var(--text)}
.chips option{background:var(--surface);color:var(--text)}
main{max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,24px)}
.window{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);margin-bottom:1.5rem;overflow:hidden}
.window>summary{list-style:none;display:flex;align-items:center;gap:.5rem;padding:.8rem 1.1rem;font-size:.95rem!important;font-weight:700!important;cursor:pointer;user-select:none;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
.window>summary::-webkit-details-marker{display:none}
.window>summary::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:16px 0 0 var(--accent),32px 0 0 var(--border);margin-right:44px}
.window:not([open])>summary{border-bottom:0}
#container{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem;padding:1.1rem}
#container:not(:has(.zone-item)){display:block;color:var(--text-muted)}
.zone-item{position:relative;aspect-ratio:1;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);transition:border-color .2s,transform .2s,box-shadow .2s}
.zone-item:hover{border-color:var(--primary);box-shadow:var(--shadow-glow);transform:translateY(-3px)}
.zone-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.zone-item:hover img{transform:scale(1.07)}
.zone-item::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(4,18,48,.92),transparent);pointer-events:none}
.zone-item button{position:absolute;left:0;right:0;bottom:0;z-index:2;background:none;border:0;color:#fff;font:inherit;font-weight:700;font-size:13px;line-height:1.25;text-align:left;padding:.6rem .7rem;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.taskbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem .4rem .8rem;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg)}
.taskbar button{background:transparent;border:1px solid transparent;color:var(--text-muted);border-radius:10px;padding:.45rem .8rem;font:inherit;font-size:13px;cursor:pointer}
.taskbar button:hover{border-color:var(--primary);color:var(--text)}
.taskbar time{color:var(--text-muted);font-size:12px;padding:0 .6rem;font-variant-numeric:tabular-nums}
#zoneViewer{display:none;position:fixed;inset:0;z-index:1000;background:var(--bg);flex-direction:column;animation:slideInUp .3s ease-out}
@keyframes slideInUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.zone-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.7rem 1.1rem;background:var(--surface);border-bottom:2px solid var(--primary)}
.zone-title{display:flex;align-items:center;gap:.6rem;min-width:0}
#zoneName{font-size:1.15rem;font-weight:800;color:var(--text)}
#zoneAuthor{color:var(--primary);font-size:.85rem;text-decoration:none}
#zoneAuthor:hover{text-decoration:underline}
.zone-controls{display:flex;gap:.4rem;flex-wrap:wrap}
.zone-controls button{background:var(--primary);color:#fff;border:0;border-radius:999px;padding:.45rem 1rem;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.zone-controls button:hover{background:var(--primary-hover)}
#zoneViewer[style*="block"]{display:flex!important}
#zoneFrame{flex:1;width:100%;border:0;background:#000}
#popupOverlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(3,14,36,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.popup{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xl);width:min(560px,92vw);max-height:85vh;overflow:auto;box-shadow:var(--shadow-xl);animation:slideInScale .25s ease-out}
@keyframes slideInScale{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.popup-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;background:var(--primary);color:#fff}
#popupTitle{font-size:1.1rem;font-weight:800}
#popupClose{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer}
#popupClose:hover{background:rgba(255,255,255,.32)}
#popupBody{padding:1.25rem;color:var(--text);line-height:1.6}
#popupBody a{color:var(--primary)}
#popupBody input[type=file]{width:100%;padding:.6rem;border:2px dashed var(--border);border-radius:var(--radius);background:var(--bg-secondary);color:var(--text)}
.settings-button,.popup button:not(#popupClose){background:var(--primary);color:#fff;border:0;border-radius:999px;padding:.5rem 1.1rem;font:inherit;font-weight:700;cursor:pointer}
.settings-button:hover,.popup button:not(#popupClose):hover{background:var(--primary-hover)}
.info-button{background:none;border:0;color:var(--primary);cursor:pointer;display:grid;place-items:center}
.info-button:hover{color:var(--primary-hover)}
@media(max-width:600px){#container{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.65rem;padding:.8rem}.taskbar{width:calc(100% - 20px);justify-content:space-between}}
.gubby-btn{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:12px;display:block;line-height:0;transition:transform .15s,box-shadow .2s}
.gubby-btn,.gubby-btn:focus,.gubby-btn:focus-visible{outline:none}
.gubby-btn.playing{box-shadow:none;animation:none;transform:none}
.gubby-modal{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(3,14,36,.75);backdrop-filter:blur(4px)}
.gubby-modal[hidden]{display:none}
.gubby-dialog{width:min(440px,100%);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);overflow:hidden}
.gubby-dialog h3{background:var(--primary);color:#fff;padding:.9rem 1.25rem;font-size:1.1rem}
.gubby-dialog p{padding:1.1rem 1.25rem .6rem;line-height:1.5}
.gubby-remember{display:flex;align-items:center;gap:.6rem;padding:.4rem 1.25rem;color:var(--text-muted);font-size:.9rem;cursor:pointer}
.gubby-remember input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.gubby-actions{display:flex;justify-content:flex-end;gap:.6rem;padding:.9rem 1.25rem 1.2rem}
.gubby-actions button{font:inherit;font-weight:700;border-radius:999px;padding:.5rem 1.3rem;cursor:pointer;border:2px solid var(--primary)}
#gubbyCancel{background:transparent;color:var(--primary)}
#gubbyCancel:hover{background:var(--primary-light)}
#gubbyPlay{background:var(--primary);color:#fff}
#gubbyPlay:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <script>
const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');
const filterOptions = document.getElementById('filterOptions');
const zonesurls = [
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
let zones = [];
let popularityData = {};
function toTitleCase(str) {
  return str.replace(
    /\w\S*/g,
    text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()
  );
}
async function listZones() {
    try {
      let sharesponse;
      let shajson;
      let sha;
        try {
          sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t="+Date.now());
        } catch (error) {}
        if (sharesponse && sharesponse.status === 200) {
          try {
            shajson = await sharesponse.json();
            sha = shajson[0]['sha'];
            if (sha) {
                zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            }
          } catch (error) {
            try {
                let secondarysharesponse = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t="+Date.now());
                if (secondarysharesponse && secondarysharesponse.status === 200) {
                    sha = (await secondarysharesponse.text()).trim();
                    if (sha) {
                        zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                    }
                }
            } catch(error) {}
          }
        }
        const response = await fetch(zonesURL+"?t="+Date.now());
        const json = await response.json();
        zones = json.filter(z => !/discord|\.gg\b/i.test(String(z.name) + String(z.url)));
        await Promise.all([fetchPopularity("year"), fetchPopularity("month"), fetchPopularity("week"), fetchPopularity("day")]);
        sortZones();
        try {
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        const embed = window.location.hash.includes("embed");
        if (id) {
            const zone = zones.find(zone => zone.id + '' == id + '');
            if (zone) {
                if (embed) {
                    if (zone.url.startsWith("http")) {
                        window.open(zone.url, "_blank");
                    } else {
                        const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
                        fetch(url+"?t="+Date.now()).then(response => response.text()).then(html => {
                            document.documentElement.innerHTML = html;
                            const popup = document.createElement("div");
                            popup.style.position = "fixed";
                            popup.style.bottom = "20px";
                            popup.style.right = "20px";
                            popup.style.backgroundColor = "#cce5ff";
                            popup.style.color = "#004085";
                            popup.style.padding = "10px";
                            popup.style.border = "1px solid #b8daff";
                            popup.style.borderRadius = "5px";
                            popup.style.boxShadow = "0px 0px 10px rgba(0,0,0,0.1)";
                            popup.style.fontFamily = "Arial, sans-serif";
                            
                            popup.innerHTML = `Play more games at <a href="Jelly Gubby" target="_blank" style="color:#004085; font-weight:bold;">Jelly Gubby</a>!`;
                            
                            const closeBtn = document.createElement("button");
                            closeBtn.innerText = "?";
                            closeBtn.style.marginLeft = "10px";
                            closeBtn.style.background = "none";
                            closeBtn.style.border = "none";
                            closeBtn.style.cursor = "pointer";
                            closeBtn.style.color = "#004085";

            if (Array.isArray(obj.special)) {
                alltags.push(...obj.special);
            }
        }

        alltags = [...new Set(alltags)];

            while (filteroption.children.length > 1) {
                filteroption.removeChild(filteroption.lastElementChild);

            opt.value = tag;

        console.error(error);
        container.innerHTML = `Error loading zones: ${error}`;
    }
}
async function fetchPopularity(duration) {
    try {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        const response = await fetch(
            "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration
        );
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[duration][id] = file.hits?.total ?? 0;
            }
        });
    } catch (error) {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        popularityData[duration][0] = 0;
    }
}


function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') {
        zones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === 'id') {
        zones.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popular') {
        zones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingMonth') {
        zones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingWeek') {
        zones.sort((a, b) => ((popularityData['week']?.[b.id]) ?? 0) - ((popularityData['week']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingDay') {
        zones.sort((a, b) => ((popularityData['day']?.[b.id]) ?? 0) - ((popularityData['day']?.[a.id]) ?? 0));
    }
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    displayZones(zones);
}

function displayZones(zones) {
    container.innerHTML = "";
    zones.forEach((file, index) => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        zoneItem.onclick = () => openZone(file);
        const img = document.createElement("img");
        img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        zoneItem.appendChild(img);
        const button = document.createElement("button");
        button.textContent = file.name;
        button.onclick = (event) => {
            event.stopPropagation();
            openZone(file);
        };
        zoneItem.appendChild(button);
        container.appendChild(zoneItem);   
    });
    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    } else {
        document.getElementById("allSummary").textContent = `All Zones (${zones.length})`;
    }

    const lazyImages = document.querySelectorAll('img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !zoneViewer.hidden) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: "100px", 
        threshold: 0.1
    });

    lazyImages.forEach(img => {
        imageObserver.observe(img);
    });
}

function openZone(file) {
    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
    } else {
        const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        fetch(url+"?t="+Date.now()).then(response => response.text()).then(html => {
            if (zoneFrame.contentDocument === null) {
                zoneFrame = document.createElement("iframe");
                zoneFrame.id = "zoneFrame";
                zoneViewer.appendChild(zoneFrame);
            }
            zoneFrame.contentDocument.open();
            zoneFrame.contentDocument.write(html);
            zoneFrame.contentDocument.close();
            document.getElementById('zoneName').textContent = file.name;
            document.getElementById('zoneId').textContent = file.id;
            document.getElementById('zoneAuthor').textContent = "by " + file.author;
            if (file.authorLink) {
                document.getElementById('zoneAuthor').href = file.authorLink;
            }
            zoneViewer.style.display = "block";
            try {
                const url = new URL(window.location);
                url.searchParams.set('id', file.id);
                history.pushState(null, '', url.toString());
            } catch(error){}
            zoneViewer.hidden = true;
        }).catch(error => alert("Failed to load zone: " + error));
    }
}

function downloadZone() {
    let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent);
    fetch(zone.url.replace("{HTML_URL}", htmlURL)+"?t="+Date.now()).then(res => res.text()).then(text => {
        const blob = new Blob([text], {
            type: "text/plain;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = zone.name + ".html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
}

let _allStatsCache = null;

async function getAllStats() {
  if (_allStatsCache) {
    return _allStatsCache;
  }

  const BASE_URL =
    "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
  const PERIOD = "year";
  const PAGE_BATCH = 5;

  let page = 1;
  let done = false;
  const combinedMap = Object.create(null);

  while (!done) {
    const pages = Array.from({ length: PAGE_BATCH }, (_, i) => page + i);

    const responses = await Promise.all(
      pages.map(p =>
        fetch(`${BASE_URL}?period=${PERIOD}&page=${p}&limit=100`)
          .then(r => (r.ok ? r.json() : []))
      )
    );

    for (const data of responses) {
      if (!Array.isArray(data) || data.length === 0) {
        done = true;
        break;
      }

      for (const item of data) {
        if (!item?.name) continue;

        const match = item.name.match(/^\/(\d+)([.-])/);
        if (!match) continue;

        const id = match[1];

        if (!combinedMap[id]) {
          combinedMap[id] = {
            hits: 0,
            bandwidth: 0
          };
        }

        combinedMap[id].hits += item.hits?.total ?? 0;
        combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
      }
    }

    page += PAGE_BATCH;
  }

  _allStatsCache = combinedMap;
  return combinedMap;
}

async function getStats(id) {
  id = String(id);
  const allStats = await getAllStats();

  return allStats[id]?.hits ?? 0;
}

        const clips = sources.map(src => new Audio(src));
        const btn = document.getElementById('gubbyBtn');
        const modal = document.getElementById('gubbyModal');
        const remember = document.getElementById('gubbyRemember');
        const KEY = 'gubbyPlayRemembered';
        let index = 0;
        let playing = false;

        function isRemembered() {
            try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; }
        }
        function saveRemembered() {
            try { localStorage.setItem(KEY, '1'); } catch (e) {}
        }
        function playCurrent() {
            const clip = clips[index];
            clip.currentTime = 0;
            const result = clip.play();
            if (result && result.catch) result.catch(stop);
        }
        function start() {
            playing = true;
            index = 0;
            btn.classList.add('playing');
            btn.setAttribute('aria-pressed', 'true');
            playCurrent();
        }
        function stop() {
            playing = false;
            clips.forEach(clip => { clip.pause(); clip.currentTime = 0; });
            index = 0;
            btn.classList.remove('playing');
            btn.setAttribute('aria-pressed', 'false');
        }
        function openModal() {
            remember.checked = false;
            modal.hidden = false;
            document.getElementById('gubbyPlay').focus();
        }
        function closeModal() {
            modal.hidden = true;
            btn.focus();
        }

        clips.forEach((clip, i) => {
            clip.addEventListener('ended', () => {
                if (!playing) return;
                index = (i + 1) % clips.length;
                playCurrent();
            });
        });

        btn.addEventListener('click', () => {
            if (playing) { stop(); return; }
            if (isRemembered()) { start(); return; }
            openModal();
        });
        document.getElementById('gubbyPlay').addEventListener('click', () => {
            if (remember.checked) saveRemembered();
            modal.hidden = true;
            start();
        });
        document.getElementById('gubbyCancel').addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
    })();

    (function () {
        const clock = document.getElementById('clock');
        function tick() { clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
        tick();
        setInterval(tick, 20000);
    })();
